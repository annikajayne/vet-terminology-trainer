<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vet Terminology Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: one centred column (max 680px) — home picks a game + topic, play shows one big word part with four answer tiles, results lists what to revise. */
:root{
  --bg:#EDF2F1; --surface:#FFFFFF; --sunk:#E2EAE8; --ink:#14211F; --muted:#566966; --line:#CFDBD8;
  --accent:#0B7268; --accent-ink:#FFFFFF; --accent-soft:#D5EBE7;
  --good:#1F7A4A; --good-soft:#DDF1E5; --bad:#B42318; --bad-soft:#FBE4E1; --pulse:#C2410C;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1615; --surface:#15211F; --sunk:#1B2926; --ink:#E3EDEA; --muted:#93A8A4; --line:#273734;
  --accent:#43C3B4; --accent-ink:#04211D; --accent-soft:#163A35;
  --good:#5CCB8E; --good-soft:#15301F; --bad:#F2806F; --bad-soft:#3A1915; --pulse:#F59E5B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1615; --surface:#15211F; --sunk:#1B2926; --ink:#E3EDEA; --muted:#93A8A4; --line:#273734;
  --accent:#43C3B4; --accent-ink:#04211D; --accent-soft:#163A35;
  --good:#5CCB8E; --good-soft:#15301F; --bad:#F2806F; --bad-soft:#3A1915; --pulse:#F59E5B; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* home */
.brand{display:flex;flex-direction:column;gap:6px}
.brand h1{font-size:clamp(2rem,6vw,2.75rem);font-weight:800;line-height:1.05}
.brand h1 .hy{color:var(--accent)}
.brand p{margin:0;color:var(--muted);max-width:52ch}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.modes{grid-template-columns:1fr 1fr}}
.mode{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;
  background:var(--surface);border:2px solid var(--line);transition:border-color .15s, transform .15s}
.mode:hover{border-color:var(--accent)}
.mode:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode b{font-family:var(--display);font-size:1.1rem}
.mode span{color:var(--muted);font-size:.9rem}
.mode .best{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.note{font-size:.85rem;color:var(--muted);margin:0}
.section{display:flex;flex-direction:column;gap:10px}
.start{align-self:flex-start;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:1.15rem;
  padding:13px 26px;border-radius:12px}
.start:hover{filter:brightness(1.07)}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:9px 16px;font-weight:700}
.ghost:hover{border-color:var(--ink)}

/* levels */
.lvls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:620px){.lvls{grid-template-columns:1fr 1fr}.lvl[data-level="all"]{grid-column:1/-1}}
.lvl{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;border-radius:12px;background:var(--surface);border:2px solid var(--line)}
.lvl:hover:not(:disabled){border-color:var(--accent)}
.lvl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lvl:disabled{opacity:.35;cursor:not-allowed}
.lvl b{display:flex;align-items:center;gap:7px;font-family:var(--display);font-size:1.02rem}
.lvl .lvn{display:none}
.lvl span{color:var(--muted);font-size:.8rem;line-height:1.3}
.dots{display:inline-flex;gap:3px;flex:none}
.dots i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--accent)}
.dots i.on{background:var(--accent)}
.askrow{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* play */
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hud .stat{display:flex;flex-direction:column;line-height:1.15}
.hud .stat b{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.hud .spacer{flex:1}
.monitor{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:10px;padding:6px 10px}
.monitor svg{width:96px;height:28px;display:block;overflow:hidden}
.monitor .trace{animation:sweep var(--beat,1.6s) linear infinite}
.monitor .bpm{font-family:var(--display);font-weight:700;color:var(--pulse);font-variant-numeric:tabular-nums;min-width:4.6ch;text-align:right}
@media (max-width:520px){.monitor svg{width:52px}.monitor .label{display:none}.hud{gap:10px}.ghost#quit{padding:7px 12px}}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(-48px)}}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.bar.time i{background:var(--pulse);transition:width 1s linear}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:6px}
.card .ask{color:var(--muted);font-size:.95rem}
.card .big{font-family:var(--display);font-weight:800;font-size:clamp(2rem,9vw,3.4rem);line-height:1.05;overflow-wrap:anywhere}
.card .big.long{font-size:clamp(1.5rem,6vw,2.2rem)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px;
  transition:border-color .12s, background .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt kbd{font-family:var(--body);font-size:.75rem;font-weight:700;color:var(--muted);border:1.5px solid var(--line);border-radius:6px;padding:0 6px;line-height:1.5;flex:none;margin-top:2px}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt.part span{font-family:var(--display);font-weight:700;font-size:1.15rem}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.feedback{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--surface)}
.feedback .verdict{font-family:var(--display);font-weight:700;font-size:1.1rem}
.feedback.ok .verdict{color:var(--good)} .feedback.no .verdict{color:var(--bad)}
.feedback ul{margin:0;padding-left:1.1em}
.feedback .brk{font-size:.95rem}
.feedback .note{color:var(--muted);font-size:.92rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* results */
.score{display:flex;gap:24px;flex-wrap:wrap}
.score div{display:flex;flex-direction:column}
.score b{font-family:var(--display);font-size:2.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.newbest{color:var(--pulse);font-weight:700}
.missed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.missed li{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:10px 14px}
.missed .q{font-family:var(--display);font-weight:700}
.missed .a{color:var(--muted);font-size:.95rem}
.clean{background:var(--good-soft);color:var(--good);border-radius:10px;padding:12px 14px;font-weight:700}
/* editor */
.srcnote{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:.85rem}
.small{padding:6px 12px;font-size:.88rem}
.ehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ehead h1{font-size:2rem;font-weight:800}
.ct{font-variant-numeric:tabular-nums;opacity:.7}
.etools{display:flex;gap:8px;flex-wrap:wrap}
.etools input{flex:1 1 200px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.etools select{width:auto}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
select:disabled{opacity:.45}
.elist{display:flex;flex-direction:column;gap:6px}
.erow{display:grid;grid-template-columns:minmax(80px,1fr) 2.2fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
.erow:hover{border-color:var(--accent)}
.erow .ep{font-family:var(--display);font-weight:700;overflow-wrap:anywhere;min-width:0}
.erow .em{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere;font-size:.93rem}
.erow small{color:var(--muted);font-size:.82rem}
@media (max-width:520px){.erow{grid-template-columns:1fr auto}.erow .em{grid-column:1/-1;grid-row:2}}
.eform{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.eform h3{font-size:1.15rem}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem;min-width:0}
.fgrid .wide,.fgrid .lvpick{grid-column:1/-1}
.hint{font-weight:400;color:var(--muted);font-size:.8rem}
.lvpick{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px 16px}
.lvpick legend{margin-bottom:6px}
.lvpick label{display:flex;align-items:center;gap:6px;font-weight:400;flex-direction:row}
.lvpick input{width:auto}
.row .spacer{flex:1}
.danger{border:0;background:var(--bad);color:var(--surface);border-radius:10px;padding:9px 16px;font-weight:700}
.dangerline{color:var(--bad);border-color:var(--bad)}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status{color:var(--good);font-weight:700;font-size:.9rem}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;font-weight:700}
.preview{background:var(--sunk);border-radius:10px;padding:10px 14px}
.errs{margin:6px 0 0;padding-left:1.1em;color:var(--bad);font-size:.9rem}
.copybox{font-size:.8rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

", "m": "Low red blood cells", "g": "signs", "l": 2, "n": "", "x": "", "k": "term"}, {"a": "Hypotension", "m": "Low blood pressure", "g": "signs", "l": 2, "n": "", "x": "", "k": "term"}, {"a": "Hypertension", "m": "High blood pressure", "g": "signs", "l": 2, "n": "", "x": "", "k": "term"}, {"a": "GIT", "m": "Gastrointestinal tract", "g": "signs", "l": 2, "n": "", "x": "gi", "k": "abbr"}, {"a": "Tenesmus", "m": "Straining to defecate", "g": "signs", "l": 2, "n": "", "x": "", "k": "term"}, {"a": "Melaena", "m": "Dark, tarry faeces from digested blood", "g": "signs", "l": 2, "n": "Compare haematochezia: fresh red blood in faeces", "x": "", "k": "term"}, {"a": "Ataxia", "m": "Wobbly, uncoordinated movement", "g": "signs", "l": 2, "n": "", "x": "", "k": "term"}, {"a": "Icterus / jaundice", "m": "Yellow colour of the gums, eyes or skin", "g": "signs", "l": 2, "n": "Caused by high bilirubin (TBIL)", "x": "", "k": "term"}, {"a": "Cyanosis", "m": "Blue gums or tongue from low oxygen", "g": "signs", "l": 2, "n": "An emergency", "x": "", "k": "term"}, {"a": "DKA", "m": "Diabetic ketoacidosis", "g": "signs", "l": 2, "n": "A life-threatening complication of uncontrolled diabetes", "x": "", "k": "abbr"}, {"a": "Eclampsia", "m": "Low blood calcium in a nursing mother, causing tremors and seizures", "g": "signs", "l": 2, "n": "Also called milk fever or puerperal tetany. An emergency", "x": "", "k": "term"}, {"a": "Entropion", "m": "Eyelid rolls inward, so hair or lashes rub on the eye", "g": "signs", "l": 2, "n": "Common in Shar Peis, Chow Chows and bulldogs. Causes squinting, tearing and corneal ulcers", "x": "", "k": "term"}, {"a": "Ectropion", "m": "Eyelid rolls outward or droops, exposing the pink conjunctiva", "g": "signs", "l": 2, "n": "Common in Bloodhounds, Basset Hounds and St Bernards", "x": "", "k": "term"}, {"a": "BOAS", "m": "Brachycephalic obstructive airway syndrome", "g": "signs", "l": 2, "n": "Breathing problems in flat-faced breeds like Pugs, French Bulldogs and British Bulldogs: narrow nostrils, a long soft palate and a narrow airway. High anaesthetic and heat-stress risk. Treated with alaplasty and soft palate resection", "x": "", "k": "abbr"}, {"a": "Hyperalgesia", "m": "Increased sensitivity to pain: something mildly painful feels very painful", "g": "signs", "l": 3, "n": "Untreated pain makes the nervous system more sensitive ('wind-up'), which is why pain relief is given before surgery starts", "x": "", "k": "term"}, {"a": "Allodynia", "m": "Pain from something that shouldn't hurt, e.g. gentle touch", "g": "signs", "l": 4, "n": "Another sign of a sensitised nervous system after untreated or long-term pain", "x": "", "k": "term"}, {"a": "Cushing's disease", "m": "Hyperadrenocorticism: the body makes too much cortisol", "g": "signs", "l": 2, "n": "Signs include PU/PD, increased appetite, pot belly, panting and hair loss. ALKP is often high", "x": "hac", "k": "term"}, {"a": "Addison's disease", "m": "Hypoadrenocorticism: the body makes too little cortisol (and often aldosterone)", "g": "signs", "l": 2, "n": "Nicknamed 'the great pretender' because signs come and go. Low Na with high K. Can cause sudden collapse (Addisonian crisis)", "x": "addisons", "k": "term"}, {"a": "Anisocoria", "m": "Uneven pupil sizes", "g": "signs", "l": 3, "n": "", "x": "", "k": "term"}, {"a": "Nystagmus", "m": "Involuntary flicking movement of the eyes, e.g. side to side", "g": "signs", "l": 3, "n": "", "x": "", "k": "term"}, {"a": "Ptyalism", "m": "Excessive drooling", "g": "signs", "l": 3, "n": "", "x": "", "k": "term"}, {"a": "HAC", "m": "Hyperadrenocorticism (Cushing's disease)", "g": "signs", "l": 3, "n": "", "x": "hac", "k": "abbr"}, {"a": "GI", "m": "Gastrointestinal: the stomach and intestines", "g": "signs", "l": 1, "n": "", "x": "gi", "k": "abbr"}, {"a": "GDV", "m": "Gastric dilatation-volvulus", "g": "signs", "l": 2, "n": "The stomach fills with gas and twists. An emergency, mostly in large, deep-chested dogs. Prevented with a gastropexy", "x": "", "k": "abbr"}, {"a": "CCL", "m": "Cranial cruciate ligament", "g": "signs", "l": 2, "n": "The dog's version of the ACL. Rupture is a very common cause of hind-leg lameness, repaired with TPLO, TTA or ELSS", "x": "", "k": "abbr"}, {"a": "IVDD", "m": "Intervertebral disc disease", "g": "signs", "l": 2, "n": "A disc between the vertebrae bulges or ruptures and presses on the spinal cord. Common in Dachshunds and French Bulldogs", "x": "", "k": "abbr"}, {"a": "MPL", "m": "Medial patellar luxation", "g": "signs", "l": 2, "n": "The kneecap slips toward the inside of the leg. Common in small breeds, and graded 1 to 4", "x": "", "k": "abbr"}, {"a": "CKD", "m": "Chronic kidney disease", "g": "signs", "l": 2, "n": "Very common in older cats. Causes PU/PD and weight loss, with rising CREA, UREA and SDMA", "x": "", "k": "abbr"}, {"a": "FLUTD", "m": "Feline lower urinary tract disease", "g": "signs", "l": 2, "n": "An umbrella term for bladder and urethra problems in cats: straining, blood in the urine, frequent small wees. Includes FIC and blocked cats", "x": "", "k": "abbr"}, {"a": "UTI", "m": "Urinary tract infection", "g": "signs", "l": 2, "n": "", "x": "", "k": "abbr"}, {"a": "URTI", "m": "Upper respiratory tract infection", "g": "signs", "l": 2, "n": "In cats, 'cat flu', usually from feline herpesvirus or calicivirus", "x": "", "k": "abbr"}, {"a": "DM", "m": "Diabetes mellitus", "g": "signs", "l": 2, "n": "Not enough insulin, or the body doesn't respond to it: high blood glucose, PU/PD and weight loss. DM can also mean degenerative myelopathy, so check the context", "x": "", "k": "abbr"}, {"a": "CHF", "m": "Congestive heart failure", "g": "signs", "l": 2, "n": "Fluid backs up into the lungs (dogs) or around them (cats). Treated with furosemide and pimobendan", "x": "", "k": "abbr"}, {"a": "AKI", "m": "Acute kidney injury", "g": "signs", "l": 3, "n": "Sudden loss of kidney function, e.g. lilies in cats, grapes or raisins in dogs, or antifreeze", "x": "", "k": "abbr"}, {"a": "FIC", "m": "Feline idiopathic cystitis", "g": "signs", "l": 3, "n": "Bladder inflammation with no known cause, closely linked to stress", "x": "", "k": "abbr"}, {"a": "HCM", "m": "Hypertrophic cardiomyopathy", "g": "signs", "l": 3, "n": "Thickened heart muscle: the most common heart disease in cats. Can cause blood clots (a saddle thrombus)", "x": "", "k": "abbr"}, {"a": "MMVD", "m": "Myxomatous mitral valve disease", "g": "signs", "l": 3, "n": "A degenerating mitral valve that causes a murmur. The most common heart disease in dogs, especially Cavaliers", "x": "", "k": "abbr"}, {"a": "KCS", "m": "Keratoconjunctivitis sicca", "g": "signs", "l": 3, "n": "Dry eye from low tear production, with thick discharge. Common in Westies, Cocker Spaniels and Shih Tzus. Checked with a Schirmer tear test", "x": "", "k": "abbr"}, {"a": "IBD", "m": "Inflammatory bowel disease", "g": "signs", "l": 3, "n": "Long-term gut inflammation causing vomiting, diarrhoea or weight loss", "x": "", "k": "abbr"}, {"a": "IMHA", "m": "Immune-mediated haemolytic anaemia", "g": "signs", "l": 3, "n": "The immune system destroys the body's own red blood cells", "x": "", "k": "abbr"}, {"a": "PSS", "m": "Portosystemic shunt", "g": "signs", "l": 3, "n": "A blood vessel carries blood around the liver instead of through it, so toxins build up. Common in small breeds like Yorkshire Terriers", "x": "", "k": "abbr"}, {"a": "PRA", "m": "Progressive retinal atrophy", "g": "signs", "l": 3, "n": "Inherited breakdown of the retina that leads to blindness", "x": "", "k": "abbr"}, {"a": "EPI", "m": "Exocrine pancreatic insufficiency", "g": "signs", "l": 3, "n": "The pancreas doesn't make enough digestive enzymes: weight loss and large, greasy faeces. Common in German Shepherds", "x": "", "k": "abbr"}, {"a": "SRMA", "m": "Steroid-responsive meningitis–arteritis", "g": "signs", "l": 4, "n": "Immune inflammation of the meninges and their blood vessels in young dogs. Causes fever and a painful neck", "x": "", "k": "abbr"}, {"a": "Na", "m": "Sodium", "g": "chem", "l": 2, "n": "Low sodium with high potassium is a classic sign of Addison's disease", "x": "", "k": "abbr"}, {"a": "K", "m": "Potassium", "g": "chem", "l": 2, "n": "High in blocked cats and Addison's disease. Can also rise suddenly in greyhounds during long anaesthetics", "x": "", "k": "abbr"}, {"a": "Cl", "m": "Chloride", "g": "chem", "l": 2, "n": "", "x": "", "k": "abbr"}, {"a": "CA", "m": "Calcium (total)", "g": "chem", "l": 2, "n": "Low calcium causes eclampsia in nursing bitches and queens. High calcium can be a sign of cancer, e.g. lymphoma", "x": "", "k": "abbr"}, {"a": "PHOS", "m": "Phosphate", "g": "chem", "l": 2, "n": "Often high in kidney disease, and normally higher in growing puppies", "x": "", "k": "abbr"}, {"a": "UREA", "m": "Urea: a waste product cleared by the kidneys", "g": "chem", "l": 2, "n": "Called BUN in the US. Rises with kidney disease, dehydration, a high-protein meal or gut bleeding", "x": "", "k": "abbr"}, {"a": "CREA", "m": "Creatinine: the main kidney marker", "g": "chem", "l": 2, "n": "Also written Creat. Rises with kidney disease or dehydration. Greyhounds normally run higher", "x": "", "k": "abbr"}, {"a": "TBIL", "m": "Total bilirubin", "g": "chem", "l": 2, "n": "Also written Bili. High bilirubin causes jaundice (icterus)", "x": "", "k": "abbr"}, {"a": "CHOL", "m": "Cholesterol", "g": "chem", "l": 2, "n": "", "x": "", "k": "abbr"}, {"a": "TP", "m": "Total protein", "g": "chem", "l": 2, "n": "High with dehydration. Low with protein loss through the gut or kidneys", "x": "prot", "k": "abbr"}, {"a": "ALB", "m": "Albumin", "g": "chem", "l": 2, "n": "Low with protein loss through the gut or kidneys, or liver failure", "x": "", "k": "abbr"}, {"a": "GLOB", "m": "Globulin", "g": "chem", "l": 2, "n": "Often high with long-term inflammation or infection", "x": "", "k": "abbr"}, {"a": "GLU / BG", "m": "Glucose (blood glucose)", "g": "chem", "l": 2, "n": "IDEXX shows GLU; hospital sheets often say BG or BGL. Low in toy-breed puppies and insulin overdose. High in diabetes, and briefly in stressed cats", "x": "", "k": "abbr"}, {"a": "Acidosis", "m": "A process that lowers the body's pH: acid builds up or bicarbonate is lost", "g": "chem", "l": 2, "n": "Can be metabolic (e.g. DKA, kidney disease, shock) or respiratory (CO₂ build-up). The other system shifts the opposite way to compensate", "x": "acid-m,acid-r", "k": "term"}, {"a": "Alkalosis", "m": "A process that raises the body's pH: acid is lost or bicarbonate builds up", "g": "chem", "l": 2, "n": "Can be metabolic (e.g. vomiting stomach acid) or respiratory (over-breathing). The other system shifts the opposite way to compensate", "x": "alk-m,alk-r", "k": "term"}, {"a": "iCa", "m": "Ionised calcium (the active form)", "g": "chem", "l": 3, "n": "", "x": "", "k": "abbr"}, {"a": "Mg", "m": "Magnesium", "g": "chem", "l": 3, "n": "", "x": "", "k": "abbr"}, {"a": "HCO₃", "m": "Bicarbonate", "g": "chem", "l": 3, "n": "The body's main buffer. Low in metabolic acidosis", "x": "", "k": "abbr"}, {"a": "SDMA", "m": "Symmetric dimethylarginine: an early kidney marker", "g": "chem", "l": 2, "n": "Rises earlier than creatinine in kidney disease", "x": "", "k": "abbr"}, {"a": "ALT", "m": "Alanine aminotransferase (liver enzyme)", "g": "chem", "l": 2, "n": "Released when liver cells are damaged", "x": "", "k": "abbr"}, {"a": "ALKP", "m": "Alkaline phosphatase (liver and bone enzyme)", "g": "chem", "l": 2, "n": "Called ALP by some labs. Often high with Cushing's or steroid treatment, and normally higher in growing puppies", "x": "", "k": "abbr"}, {"a": "AST", "m": "Aspartate aminotransferase (liver and muscle enzyme)", "g": "chem", "l": 2, "n": "", "x": "", "k": "abbr"}, {"a": "GGT", "m": "Gamma-glutamyl transferase (liver enzyme)", "g": "chem", "l": 2, "n": "", "x": "", "k": "abbr"}, {"a": "ALB/GLOB", "m": "Albumin:globulin ratio", "g": "chem", "l": 2, "n": "Also written A:G", "x": "", "k": "abbr"}, {"a": "Fructosamine", "m": "Average blood glucose over the last 1–3 weeks", "g": "chem", "l": 3, "n": "Used to monitor diabetes. Unlike glucose, stress doesn't affect it, which is useful in cats", "x": "", "k": "term"}, {"a": "cPL / fPL", "m": "Canine / feline pancreatic lipase (pancreatitis test)", "g": "chem", "l": 3, "n": "IDEXX runs these as Spec cPL / Spec fPL at the lab, or as SNAP tests in clinic", "x": "", "k": "abbr"}, {"a": "CK", "m": "Creatine kinase (muscle enzyme)", "g": "chem", "l": 3, "n": "High after muscle damage, e.g. seizures, trauma or IM injections", "x": "", "k": "abbr"}, {"a": "LAC", "m": "Lactate", "g": "chem", "l": 3, "n": "High with poor blood flow, e.g. shock or GDV", "x": "", "k": "abbr"}, {"a": "pH", "m": "How acidic or alkaline something is", "g": "chem", "l": 3, "n": "Normal blood pH is about 7.35–7.45", "x": "", "k": "abbr"}, {"a": "Respiratory acidosis", "m": "CO₂ builds up from under-breathing, e.g. deep anaesthesia or an airway obstruction", "g": "chem", "l": 3, "n": "", "x": "acid-r", "k": "term"}, {"a": "Respiratory alkalosis", "m": "Too much CO₂ is breathed off from over-breathing, e.g. panting from pain, anxiety or heat", "g": "chem", "l": 3, "n": "", "x": "alk-r", "k": "term"}, {"a": "Metabolic acidosis", "m": "Acid builds up or bicarbonate is lost, e.g. DKA, kidney disease, shock or severe diarrhoea", "g": "chem", "l": 3, "n": "", "x": "acid-m", "k": "term"}, {"a": "Metabolic alkalosis", "m": "Acid is lost or bicarbonate builds up, e.g. vomiting stomach contents", "g": "chem", "l": 3, "n": "", "x": "alk-m", "k": "term"}, {"a": "mmol/L", "m": "Millimoles per litre", "g": "chem", "l": 3, "n": "Used for electrolytes, glucose and urea", "x": "", "k": "abbr"}, {"a": "µmol/L", "m": "Micromoles per litre", "g": "chem", "l": 3, "n": "Used for creatinine and bilirubin", "x": "", "k": "abbr"}, {"a": "g/L", "m": "Grams per litre", "g": "chem", "l": 3, "n": "Used for proteins", "x": "", "k": "abbr"}, {"a": "U/L", "m": "Units per litre", "g": "chem", "l": 3, "n": "Used for enzymes like ALT and ALKP", "x": "", "k": "abbr"}, {"a": "×10⁹/L", "m": "Billions per litre", "g": "chem", "l": 3, "n": "Used for blood cell counts", "x": "", "k": "abbr"}, {"a": "Acidaemia", "m": "Blood pH below normal (below about 7.35)", "g": "chem", "l": 4, "n": "Acidosis is the process; acidaemia is the result in the blood. With compensation, a patient can have an acidosis without acidaemia", "x": "", "k": "term"}, {"a": "Alkalaemia", "m": "Blood pH above normal (above about 7.45)", "g": "chem", "l": 4, "n": "Alkalosis is the process; alkalaemia is the result in the blood", "x": "", "k": "term"}, {"a": "Compensation", "m": "The other system (lungs or kidneys) shifts the opposite way to bring pH back toward normal", "g": "chem", "l": 4, "n": "e.g. a respiratory alkalosis can trigger a compensatory metabolic acidosis, and vice versa", "x": "", "k": "term"}, {"a": "pCO₂", "m": "Partial pressure of carbon dioxide", "g": "chem", "l": 4, "n": "Shows how well CO₂ is being breathed off: the respiratory side of acid–base", "x": "", "k": "abbr"}, {"a": "pO₂", "m": "Partial pressure of oxygen", "g": "chem", "l": 4, "n": "", "x": "", "k": "abbr"}, {"a": "BE", "m": "Base excess", "g": "chem", "l": 4, "n": "The metabolic side of acid–base: negative in metabolic acidosis, positive in metabolic alkalosis", "x": "", "k": "abbr"}, {"a": "Bile acids", "m": "Liver function test, taken before and after a meal", "g": "chem", "l": 4, "n": "Used to check for problems like a portosystemic shunt", "x": "", "k": "term"}, {"a": "NH₃", "m": "Ammonia", "g": "chem", "l": 4, "n": "High when the liver can't clear it, e.g. a portosystemic shunt. Causes hepatic encephalopathy", "x": "", "k": "abbr"}, {"a": "TLI", "m": "Trypsin-like immunoreactivity", "g": "chem", "l": 4, "n": "Test for exocrine pancreatic insufficiency (EPI)", "x": "", "k": "abbr"}, {"a": "RBC", "m": "Red blood cells (count)", "g": "haem", "l": 1, "n": "", "x": "", "k": "abbr"}, {"a": "HCT", "m": "Haematocrit: function reindex(){
  meaningsOf = {}; P.forEach(p => { (meaningsOf[p.p] ||= new Set()).add(norm(p.m)); });
  antsOf = {}; A.forEach(a => { (antsOf[norm(a.a)] ||= new Set()).add(norm(a.b)); });
}
reindex();

function pickDistractors(correct, banned, pools, textOf, n=3){
  const out = [], seen = new Set([norm(correct), ...banned]);
  for (const pool of pools){
    for (const x of shuffle(pool)){
      const t = textOf(x), k = norm(t);
      if (seen.has(k)) continue;
      seen.add(k); out.push(t);
      if (out.length===n) return out;
    }
  }
  return out;
}

/* ---------- question builders ---------- */
function makeQ(kind, item){
  let q;
  if (kind==='meaning'){
    const same = P.filter(x => x.c===item.c), typ = P.filter(x => x.t===item.t);
    const ds = pickDistractors(item.m, meaningsOf[item.p], [same, typ, P], x => x.m);
    q = {ask:'What does this word part mean?', big:item.p, correct:item.m, ds, partOpts:false,
         explain:`<b>${esc(item.p)}</b> = ${esc(item.m)}<ul>${item.e.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`};
  } else if (kind==='reverse'){
    const banned = P.filter(x => norm(x.m)===norm(item.m)).map(x => norm(x.p));
    const same = P.filter(x => x.c===item.c), typ = P.filter(x => x.t===item.t);
    const ds = pickDistractors(item.p, banned, [same, typ], x => x.p);
    q = {ask:'Which word part means…', big:item.m, correct:item.p, ds, partOpts:true,
         explain:`<b>${esc(item.p)}</b> = ${esc(item.m)}<ul>${item.e.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`};
  } else if (kind==='decode'){
    const same = T.filter(x => x.s===item.s);
    const ds = pickDistractors(item.d, [], [same, T], x => x.d);
    q = {ask:'What does this term mean?', big:item.t, correct:item.d, ds, partOpts:false,
         explain:`<div class="brk"><b>${esc(item.t)}</b> = ${esc(item.b)}</div><div>${esc(item.d)}</div>`};
  } else if (kind==='abbr' || kind==='abbrrev'){
    const same = X.filter(x => x.g===item.g);
    const note = item.n ? `<div class="note">${esc(item.n)}</div>` : '';
    const explain = `<div><b>${esc(item.a)}</b> = ${esc(item.m)}</div>${note}`;
    if (kind==='abbr'){
      const banned = X.filter(x => norm(x.a)===norm(item.a) || sameMeaning(item, x)).map(x => norm(x.m));
      const ds = pickDistractors(item.m, banned, [same, X], x => x.m);
      q = {ask:item.k==='abbr' ? 'What does this abbreviation mean?' : 'What does this term mean?', big:item.a, correct:item.m, ds, partOpts:false, explain};
    } else {
      const banned = X.filter(x => norm(x.m)===norm(item.m) || sameMeaning(item, x)).map(x => norm(x.a));
      const kin = x => x.k===item.k;
      const ds = pickDistractors(item.a, banned, [same.filter(kin), X.filter(kin), X], x => x.a);
      q = {ask:item.k==='abbr' ? 'Which abbreviation means…' : 'Which term means…', big:item.m, correct:item.a, ds, partOpts:true, explain};
    }
  } else {
    const banned = [...(antsOf[norm(item.a)]||[]), norm(item.a)];
    const isPart = s => /[-\/]/.test(s);
    const pool = A.flatMap(x => [x.a, x.b]).map(t => ({t}));
    const ds = pickDistractors(item.b, banned, [pool.filter(o => isPart(o.t)===isPart(item.b)), pool], x => x.t);
    q = {ask:'What is the opposite of…', big:item.a, correct:item.b, ds, partOpts:true,
         explain:`<b>${esc(item.a)}</b> ↔ <b>${esc(item.b)}</b><div>${esc(item.e)}</div>`};
  }
  const options = shuffle([q.correct, ...q.ds]);
  return {kind, src:item, ask:q.ask, big:q.big, options, answer:options.indexOf(q.correct), correct:q.correct,
          partOpts:q.partOpts, explain:q.explain, picked:null};
}

function blitzKinds(topic){
  const k = [];
  if (partsFor(topic).length>=4) k.push('meaning','meaning','reverse');
  if (termsFor(topic).length) k.push('decode','decode');
  if (topic==='all' && antsFor().length) k.push('opposites');
  if (topic==='all' && abbrFor('all').length) k.push('abbr','abbr');
  return k;
}
function randomQ(topic){
  const kinds = blitzKinds(topic), kind = kinds[Math.floor(Math.random()*kinds.length)];
  const pool = kind==='decode' ? termsFor(topic) : kind==='opposites' ? antsFor() : kind==='abbr' ? abbrFor('all') : partsFor(topic);
  return makeQ(kind, pool[Math.floor(Math.random()*pool.length)]);
}

/* ---------- shared term list (db) ---------- */
const LIST_KEYS = ['parts','terms','ants','abbr'];
const LIVE = {db:null, canEdit:false, live:{}, updated:{}, saving:{}, again:{}};
const SYSTEMS = TOPICS.filter(([k]) => !['all','prefix','suffix'].includes(k));
const TERM_TOPICS = SYSTEMS.filter(([k]) => k!=='position');
const getList = k => k==='parts' ? P : k==='terms' ? T : k==='abbr' ? X : A;
function setList(k, items){ if (k==='parts') P = items; else if (k==='terms') T = items; else if (k==='abbr') X = items; else A = items; reindex(); }
const str = v => typeof v==='string' ? v : v==null ? '' : String(v);
const lvl = v => [1,2,3,4].includes(+v) ? +v : 3;
const autoC = (t,s) => t==='prefix' ? 'Prefix' : t==='suffix' ? 'Suffix' : 'Root: '+s;
function clean(k, x){
  if (!x || typeof x!=='object') return null;
  if (k==='parts'){
    const p = str(x.p).trim(), m = str(x.m).trim(); if (!p || !m) return null;
    const t = ['prefix','root','suffix'].includes(x.t) ? x.t : 'root';
    const s = t==='root' && SYSTEMS.some(([q]) => q===x.s) ? x.s : 'general';
    const e = (Array.isArray(x.e) ? x.e.map(str) : str(x.e).split(/\s*\|\s*|\n/)).map(v => v.trim()).filter(Boolean);
    return {p, m, e, t, s, l:lvl(x.l), c:str(x.c) || autoC(t,s)};
  }
  if (k==='terms'){
    const t = str(x.t).trim(), d = str(x.d).trim(); if (!t || !d) return null;
    return {t, b:str(x.b).trim(), d, s:TERM_TOPICS.some(([q]) => q===x.s) ? x.s : 'general', l:lvl(x.l)};
  }
  if (k==='abbr'){
    const a = str(x.a).trim(), m = str(x.m).trim(); if (!a || !m) return null;
    const g = ABBR_TOPICS.some(([q]) => q===x.g && q!=='all') ? x.g : 'exam';
    const tag = str(x.x).trim();
    const k2 = x.k==='abbr' || x.k==='term' ? x.k : (a===a.toUpperCase() || /^[A-Z][a-z]$/.test(a) ? 'abbr' : 'term');
    return {a, m, g, l:lvl(x.l), n:str(x.n).trim(), k:k2, x:tag};
  }
  const a = str(x.a).trim(), b = str(x.b).trim(); if (!a || !b) return null;
  return {a, b, e:str(x.e).trim(), l:lvl(x.l)};
}
function refresh(){
  if (S.screen==='home') render();
  else if (S.screen==='edit' && E.editing===null && !E.paste) render();
}
async function connect(){
  let db = null, user = null;
  try { db = await window.claude?.use?.('db'); } catch(e){}
  if (!db) return;
  LIVE.db = db;
  try { user = await window.claude.use('user'); } catch(e){}
  try { LIVE.canEdit = !!(user && ((await user.isOwner()) || (await user.canEdit()))); } catch(e){}
  LIST_KEYS.forEach(k => {
    try {
      db.doc('lists/'+k).onSnapshot(snap => {
        if (!snap.exists) return;
        const d = snap.data() || {};
        if (!Array.isArray(d.items)) return;
        const items = d.items.map(x => clean(k, x)).filter(Boolean);
        if (items.length < (k==='ants' ? 1 : 4)) return;
        LIVE.live[k] = true; LIVE.updated[k] = str(d.updatedAt);
        setList(k, items); refresh();
      }, () => {});
    } catch(e){}
  });
  refresh();
}
async function saveList(k){
  if (!LIVE.db){ E.err = 'Saving needs you to be signed in to Claude.'; return false; }
  if (LIVE.saving[k]){ LIVE.again[k] = true; return true; }
  LIVE.saving[k] = true; E.status = 'Saving…'; E.err = ''; paintStatus();
  let ok = true;
  try {
    const now = new Date().toISOString();
    await LIVE.db.doc('lists/'+k).set({items:getList(k).map(x => ({...x})), count:getList(k).length, updatedAt:now});
    LIVE.live[k] = true; LIVE.updated[k] = now; E.status = 'Saved';
  } catch(e){
    ok = false; E.status = '';
    E.err = e && e.code==='quota_exceeded' ? 'The list is too large to save. Remove some entries, then save again.'
      : e && e.code==='invalid_argument' ? 'That change could not be saved. Only you (and anyone you make an Editor) can change the term list.'
      : 'Could not save. Check your connection, then try again.';
  }
  LIVE.saving[k] = false; paintStatus();
  if (LIVE.again[k]){ LIVE.again[k] = false; return saveList(k); }
  return ok;
}
function lastUpdated(){
  const ds = LIST_KEYS.map(k => LIVE.updated[k]).filter(Boolean).sort();
  if (!ds.length) return '';
  const d = new Date(ds[ds.length-1]);
  return isNaN(d) ? '' : d.toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'});
}

/* ---------- level suggestion for whole terms ---------- */
const GRAMMAR = new Set(['-ia','-al','-ic','-ous','-ar','-ary','-eal']);
function suggestLevel(breakdown){
  const names = {};
  P.forEach(x => x.p.split(/,\s*|\s+\/\s+/).forEach(n => { const k = n.trim().toLowerCase(); names[k] = Math.min(names[k] || 9, x.l); }));
  const ls = str(breakdown).split(/\s*[+;]\s*/).map(t => t.replace(/\s*\(.*$/,'').trim().toLowerCase())
    .filter(t => t in names && !GRAMMAR.has(t)).map(t => names[t]);
  return ls.length ? Math.max(...ls) : 3;
}

/* ---------- spreadsheet copy / paste ---------- */
const COLS = {
  parts:[['p','Word part'],['m','Meaning'],['e','Examples'],['t','Type'],['s','Topic'],['l','Level']],
  terms:[['t','Term'],['b','Breakdown'],['d','Definition'],['s','Topic'],['l','Level']],
  ants:[['a','Word part'],['b','Opposite'],['e','Example'],['l','Level']],
  abbr:[['a','Abbreviation or term'],['m','Meaning'],['g','Group'],['n','Note'],['l','Level']]
};
const TYPE_NAMES = {prefix:'Prefix', root:'Root', suffix:'Suffix'};
const topicName = k => (TOPICS.find(t => t[0]===k) || ['', 'General roots'])[1];
const cellOut = v => str(v).replace(/[\t\r\n]+/g, ' ');
function toTSV(k){
  const cols = COLS[k];
  const rows = getList(k).map(x => cols.map(([f]) =>
    f==='g' ? anyTopicName(x.g) : f==='e' && Array.isArray(x.e) ? x.e.join(' | ') : f==='t' && k==='parts' ? TYPE_NAMES[x.t] : f==='s' ? (k==='parts' && x.t!=='root' ? '' : topicName(x.s)) : x[f]).map(cellOut).join('\t'));
  return [cols.map(c => c[1]).join('\t'), ...rows].join('\n');
}
function readTopic(v, forTerms){
  const s = str(v).trim().toLowerCase(); if (!s) return 'general';
  const pool = forTerms ? TERM_TOPICS : SYSTEMS;
  const hit = pool.find(([k,n]) => k===s || n.toLowerCase()===s || n.toLowerCase().startsWith(s) || s.startsWith(k));
  return hit ? hit[0] : null;
}
function readLevel(v){
  const s = str(v).trim().toLowerCase();
  if (/^[1234]$/.test(s)) return +s;
  if (s.startsWith('found') || s.startsWith('begin')) return 1; if (s.startsWith('core')) return 2; if (s.startsWith('inter')) return 3; if (s.startsWith('adv')) return 4;
  return s ? null : 0;
}
function parsePaste(k, text){
  const lines = str(text).replace(/\r/g,'').split('\n').filter(l => l.trim());
  if (!lines.length) return {items:[], errors:['Nothing to read. Paste rows copied from a spreadsheet.']};
  const cols = COLS[k];
  let order = cols.map(c => c[0]);
  const head = lines[0].split('\t').map(h => h.trim().toLowerCase());
  if (head.some(h => cols.some(c => c[1].toLowerCase()===h))){
    order = head.map(h => (cols.find(c => c[1].toLowerCase()===h) || [null])[0]);
    lines.shift();
  }
  const items = [], errors = [];
  lines.forEach((line, i) => {
    const cells = line.split('\t'), raw = {};
    order.forEach((f, j) => { if (f) raw[f] = (cells[j] || '').trim(); });
    const row = `Row ${i+1}`;
    if (k==='parts'){
      const t = str(raw.t).toLowerCase().startsWith('p') ? 'prefix' : str(raw.t).toLowerCase().startsWith('s') ? 'suffix' : raw.t ? 'root'
        : raw.p && raw.p.endsWith('-') ? 'prefix' : raw.p && raw.p.startsWith('-') ? 'suffix' : 'root';
      raw.t = t;
      if (t==='root'){ const s = readTopic(raw.s, false); if (s===null){ errors.push(`${row}: topic "${raw.s}" not recognised`); return; } raw.s = s; }
    } else if (k==='abbr'){
      const gv = str(raw.g).trim().toLowerCase();
      const hit = ABBR_TOPICS.find(([q,n]) => q!=='all' && (q===gv || n.toLowerCase()===gv || (gv && n.toLowerCase().startsWith(gv))));
      if (gv && !hit){ errors.push(`${row}: group "${raw.g}" not recognised`); return; }
      raw.g = hit ? hit[0] : 'exam'; delete raw.k;
    } else if (k==='terms'){
      const s = readTopic(raw.s, true); if (s===null){ errors.push(`${row}: topic "${raw.s}" not recognised`); return; } raw.s = s;
    }
    const L = readLevel(raw.l);
    if (L===null){ errors.push(`${row}: level "${raw.l}" should be 1, 2, 3 or 4`); return; }
    raw.l = L || (k==='terms' ? suggestLevel(raw.b) : 2);
    const item = clean(k, raw);
    if (!item){ errors.push(`${row}: ${k==='parts' ? 'word part and meaning are' : k==='terms' ? 'term and definition are' : k==='abbr' ? 'abbreviation and meaning are' : 'both word parts are'} required`); return; }
    items.push(item);
  });
  return {items, errors};
}
const itemKey = (k, x) => k==='parts' ? norm(x.p)+'|'+norm(x.m) : k==='terms' ? norm(x.t) : k==='abbr' ? norm(x.a) : norm(x.a)+'|'+norm(x.b);

async function commit(k, next){
  const prev = getList(k);
  setList(k, next);
  const ok = await saveList(k);
  if (!ok){ setList(k, prev); }
  return ok;
}
async function submitForm(k){
  const item = readForm(k);
  if (!item){ E.err = k==='parts' ? 'Add a word part and its meaning.' : k==='terms' ? 'Add the term and its definition.' : k==='abbr' ? 'Add the abbreviation and its meaning.' : 'Add both word parts.'; paintStatus(); return; }
  const list = getList(k).slice(), at = E.editing==='new' ? -1 : E.editing;
  if (k==='abbr' && at>=0) item.x = list[at].x || '';
  if (k==='parts' && at>=0 && (item.t!==list[at].t || item.s!==list[at].s)) item.c = autoC(item.t, item.s);
  else if (k==='parts' && at>=0) item.c = list[at].c;
  if (list.some((x,i) => i!==at && itemKey(k,x)===itemKey(k,item))){ E.err = 'That entry is already in the list.'; paintStatus(); return; }
  if (at>=0) list[at] = item; else list.push(item);
  E.err = '';
  if (await commit(k, list)){ E.editing = null; E.confirm = false; if (at<0){ E.q = ''; E.lv = 'all'; } }
  render();
}

  const tabs = Object.entries(TAB_NAMES).map(([t,n]) => `<button class="chip" data-tab="${t}" aria-pressed="${t===k}">${n} <span class="ct">${getList(t).length}</span></button>`).join('');
  const lvls = [['all','All levels'], ...Object.entries(LEVEL_NAMES)].map(([v,n]) => opt(v,n,E.lv)).join('');
  const paste = E.paste ? `<div class="eform"><h3>Paste from a spreadsheet</h3>
      <p class="note">Columns: ${COLS[k].map(c => c[1]).join(', ')}. Keep the heading row if you have it. ${k==='parts' ? 'Separate examples with " | ". ' : ''}Levels can be 1 to 4, or Foundation, Core, Intermediate, Advanced.</p>
      <textarea id="p-text" rows="7" placeholder="Paste rows here">${esc(E.pasteText)}</textarea>
      <fieldset class="lvpick"><legend class="label">What to do with the rows</legend>
        <label><input type="radio" name="p-mode" value="merge" ${E.pasteMode==='merge'?'checked':''}> Add new rows and update matching ones</label>
        <label><input type="radio" name="p-mode" value="replace" ${E.pasteMode==='replace'?'checked':''}> Replace the whole ${TAB_NAMES[k].toLowerCase()} list</label></fieldset>
      ${E.preview ? `<div class="preview">${E.preview.summary}${E.preview.errors.length ? `<ul class="errs">${E.preview.errors.slice(0,12).map(x => `<li>${esc(x)}</li>`).join('')}${E.preview.errors.length>12 ? `<li>…and ${E.preview.errors.length-12} more</li>` : ''}</ul>` : ''}</div>` : ''}
      <div class="row"><button type="button" class="ghost" id="p-check">Check rows</button>
        ${E.preview && E.preview.ok ? '<button type="button" class="start" id="p-apply">Apply</button>' : ''}
        <button type="button" class="ghost" id="p-cancel">Cancel</button></div></div>` : '';
  $('#app').innerHTML = `
    <header class="ehead"><div><span class="label">Only you can see this</span><h1>Term list</h1></div>
      <button class="ghost" id="e-done">Back to games</button></header>
    <p class="note">Changes save straight away. Anyone signed in to Claude sees them the next time the app loads. People who open the link without signing in see the built-in copy, so ask Claude to update the built-in copy after a batch of changes.</p>
    <div class="chips">${tabs}</div>
    <div class="etools">
      <input id="e-q" type="search" placeholder="Search ${TAB_NAMES[k].toLowerCase()}" value="${esc(E.q)}" aria-label="Search">
      <select id="e-lv" aria-label="Level">${lvls}</select>
      <button class="start" id="e-add">Add</button>
    </div>
    <div class="row"><button class="ghost small" id="e-copy">Copy as spreadsheet</button><button class="ghost small" id="e-paste">Paste from spreadsheet</button>
      <span class="status" id="estatus" role="status">${esc(E.status)}</span></div>
    <div class="err" id="eerr" role="alert" ${E.err ? '' : 'hidden'}>${esc(E.err)}</div>
    <textarea id="e-copybox" class="copybox" rows="4" hidden readonly></textarea>
    ${paste}
    ${E.editing!==null ? formHTML(k) : ''}
    <p class="note">${rows.length} of ${list.length} shown. Tap an entry to edit it.</p>
    <div class="elist">${rows.map(({x,i}) => rowHTML(k,x,i)).join('') || '<p class="note">Nothing matches.</p>'}</div>`;

  $('#e-done').onclick = () => { E.editing = null; E.paste = false; S.screen = 'home'; render(); };
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { E.tab = b.dataset.tab; E.editing = null; E.paste = false; E.preview = null; E.q = ''; E.err = ''; E.status = ''; render(); });
  const qi = $('#e-q'); qi.oninput = () => { E.q = qi.value; const pos = qi.selectionStart; render(); const n = $('#e-q'); n.focus(); try { n.setSelectionRange(pos,pos); } catch(e){} };
  $('#e-lv').onchange = e => { E.lv = e.target.value; render(); };
  $('#e-add').onclick = () => { E.editing = 'new'; E.confirm = false; E.paste = false; E.err = ''; render(); const f = $('#eform input'); if (f) f.focus(); };
  document.querySelectorAll('.erow').forEach(b => b.onclick = () => { E.editing = +b.dataset.i; E.confirm = false; E.paste = false; E.err = ''; render(); $('#eform').scrollIntoView({block:'nearest'}); });
  $('#e-copy').onclick = async () => {
    const tsv = toTSV(k);
    try { await navigator.clipboard.writeText(tsv); E.status = `Copied ${list.length} rows. Paste them into Excel or Google Sheets.`; paintStatus(); }
    catch(e){ const box = $('#e-copybox'); box.hidden = false; box.value = tsv; box.focus(); box.select(); E.status = 'Copy the selected text (Ctrl+C or ⌘C).'; paintStatus(); }
  };
  $('#e-paste').onclick = () => { E.paste = !E.paste; E.editing = null; E.preview = null; render(); };
  const form = $('#eform');
  if (form){
    form.onsubmit = ev => { ev.preventDefault(); submitForm(k); };
    $('#f-cancel').onclick = () => { E.editing = null; E.err = ''; render(); };
    const ft = $('#f-t'), fs = $('#f-s');
    if (k==='parts' && ft) ft.onchange = () => { fs.disabled = ft.value!=='root'; };
    const sg = $('#f-suggest'); if (sg) sg.onclick = () => { const r = $('#f-l'+suggestLevel($('#f-b').value)); if (r) r.checked = true; };
    const d = $('#f-del'); if (d) d.onclick = () => { E.confirm = true; render(); };
    const dn = $('#f-del-no'); if (dn) dn.onclick = () => { E.confirm = false; render(); };
    const dy = $('#f-del-yes'); if (dy) dy.onclick = async () => {
      const list2 = getList(k).slice(); list2.splice(E.editing, 1);
      if (k!=='ants' && list2.length < 4){ E.err = 'Keep at least 4 entries so the game can make questions.'; paintStatus(); return; }
      if (await commit(k, list2)){ E.editing = null; E.confirm = false; }
      render();
    };
  }
  if (E.paste){
    const ta = $('#p-text'); ta.oninput = () => { E.pasteText = ta.value; E.preview = null; const a = $('#p-apply'); if (a) a.remove(); };
    document.querySelectorAll('input[name="p-mode"]').forEach(r => r.onchange = () => { E.pasteMode = r.value; E.preview = null; render(); });
    $('#p-cancel').onclick = () => { E.paste = false; E.preview = null; render(); };
    $('#p-check').onclick = () => {
      const {items, errors} = parsePaste(k, E.pasteText);
      const cur = getList(k), keys = new Map(cur.map((x,i) => [itemKey(k,x), i]));
      let adds = 0, updates = 0;
      items.forEach(x => keys.has(itemKey(k,x)) ? updates++ : adds++);
      const min = k==='ants' ? 1 : 4;
      const ok = items.length>0 && (E.pasteMode==='merge' || items.length>=min);
      const summary = !items.length ? '<b>No usable rows found.</b>'
        : E.pasteMode==='replace' ? `<b>${items.length} rows will replace the current ${cur.length}.</b>${items.length<min ? ` You need at least ${min}.` : ''}`
        : `<b>${adds} new, ${updates} updated.</b>`;
      E.preview = {items, errors, ok, summary: summary + (errors.length ? ` ${errors.length} row${errors.length>1?'s':''} skipped:` : '')};
      render();
    };
    const ap = $('#p-apply'); if (ap) ap.onclick = async () => {
      const {items} = E.preview; let next;
      if (E.pasteMode==='replace') next = items;
      else {
        next = getList(k).slice(); const keys = new Map(next.map((x,i) => [itemKey(k,x), i]));
        items.forEach(x => { const i = keys.get(itemKey(k,x)); if (i!==undefined){ if (k==='parts') x.c = next[i].c; if (k==='abbr') x.x = next[i].x || ''; next[i] = x; } else { keys.set(itemKey(k,x), next.length); next.push(x); } });
      }
      if (await commit(k, next)){ E.paste = false; E.pasteText = ''; E.preview = null; E.status = `Saved ${items.length} rows.`; }
      render();
    };
  }
}

/* ---------- state ---------- */
let S = {screen:'home', mode:'meaning', topic:'all', level:'1', queue:[], i:0, q:null, score:0, streak:0, bestStreak:0,
         right:0, answered:0, missed:[], endAt:0, practice:false, lastBest:false};
let tick = null;

function startRound(practiceItems){
  const {mode, topic} = S;
  Object.assign(S, {screen:'play', i:0, score:0, streak:0, bestStreak:0, right:0, answered:0, missed:[], practice:!!practiceItems, lastBest:false});
  if (practiceItems){
    S.queue = shuffle(practiceItems);
  } else if (mode==='blitz'){
    S.queue = []; S.endAt = Date.now() + BLITZ_SECS*1000;
  } else {
    const pool = mode==='decode' ? termsFor(topic) : mode==='opposites' ? antsFor() : mode==='abbr' ? abbrFor(topic) : partsFor(topic);
    S.queue = shuffle(pool).slice(0, ROUND).map(item => ({kind: mode==='abbr' ? (Math.random()<0.7 ? 'abbr' : 'abbrrev') : mode, item}));
  }
  nextQ(true);
}
function nextQ(first){
  if (!first) S.i++;
  if (S.mode==='blitz' && !S.practice){
    if (Date.now() >= S.endAt) return finish();
    S.q = randomQ(S.topic);
  } else {
    if (S.i >= S.queue.length) return finish();
    const {kind,item} = S.queue[S.i]; S.q = makeQ(kind, item);
  }
  render();
}
function answer(idx){
  const q = S.q; if (!q || q.picked!==null) return;
  q.picked = idx; S.answered++;
  const ok = idx===q.answer;
  if (ok){ S.right++; S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak); S.score += 100 + 10*Math.min(S.streak-1, 10); }
  else { S.streak = 0; S.missed.push({kind:q.kind, item:q.src, big:q.big, correct:q.correct}); }
  render();
  const card = $('#qcard'); if (card) card.classList.add(ok ? 'pop' : 'shake');
  if (S.mode==='blitz' && !S.practice) setTimeout(() => { if (S.q===q) nextQ(); }, ok ? 650 : 1600);
  else { const n = $('#next'); if (n) n.focus({preventScroll:true}); }
}
function finish(){
  clearInterval(tick); tick = null;
  if (!S.practice){
    const key = `best:${S.mode}:${S.topic}:${S.level}`, prev = store.get(key) || 0;
    S.lastBest = S.score > prev && S.score > 0;
    if (S.lastBest) store.set(key, S.score);
  }
  S.screen = 'results'; S.q = null; render();
}

/* ---------- views ---------- */
function ecg(){
  const bpm = Math.min(60 + S.streak*14, 200), beat = (60/bpm)*1.6;
  const seg = 'l6 0 l2 -3 l2 3 l3 0 l2 6 l3 -20 l3 22 l2 -8 l3 0 l3 -4 l3 4 l16 0';
  return `<div class="monitor" title="Streak heart rate: it speeds up as your streak grows">
    <svg viewBox="0 0 96 28" aria-hidden="true"><g class="trace" style="--beat:${beat}s">
      <path d="M0 16 ${seg} ${seg} ${seg}" fill="none" stroke="var(--pulse)" stroke-width="1.8" stroke-linejoin="round"/></g></svg>
    <span class="bpm">${bpm}</span><span class="label">bpm</span></div>`;
}
function renderHome(){
  if (!levelAvailable(S.mode, S.level)) S.level = 'all';
  if (!topicAvailable(S.mode, S.topic, S.level)) S.topic = 'all';
  const modeCards = Object.entries(MODES).map(([k,m]) => {
    const best = store.get(`best:${k}:${S.topic}:${S.level}`);
    return `<button class="mode" data-mode="${k}" aria-pressed="${S.mode===k}"><b>${m.name}</b><span>${m.desc}</span>
      <span class="best">${best ? 'Best: '+best.toLocaleString() : '&nbsp;'}</span></button>`;
  }).join('');
  const chips = topicsFor(S.mode).map(([k,n]) => `<button class="chip" data-topic="${k}" aria-pressed="${S.topic===k}" ${topicAvailable(S.mode,k,S.level)?'':'disabled'}>${n}</button>`).join('');
  const levels = LEVELS.map(([k,n,d]) => `<button class="lvl" data-level="${k}" aria-pressed="${S.level===k}" ${levelAvailable(S.mode,k)?'':'disabled'}>
      <b>${dots(k)}${k==='all'?'':`<span class="lvn">${k}</span>`}${n}</b>${d?`<span>${d}</span>`:'<span>Mix of all three</span>'}</button>`).join('');
  const count = S.mode==='abbr' ? abbrFor(S.topic).length : S.mode==='opposites' ? antsFor().length : S.mode==='decode' ? termsFor(S.topic).length : S.mode==='blitz' ? partsFor(S.topic).length + termsFor(S.topic).length : partsFor(S.topic).length;
  const what = S.mode==='abbr' ? 'abbreviations and terms' : S.mode==='opposites' ? 'antonym pairs' : S.mode==='decode' ? 'whole terms' : S.mode==='blitz' ? 'word parts and terms' : 'word parts';
  const tip = S.mode==='abbr' ? `${ROUND} questions per round. Most show the abbreviation; some ask you to name it.`
    : S.mode==='opposites' ? 'Opposites covers all topics at once.'
    : S.mode==='decode' ? 'Decode uses whole terms, so it is sorted by body system only.'
    : S.mode==='blitz' ? 'Score as many as you can in 60 seconds. Streaks add bonus points.'
    : `${ROUND} questions per round. Streaks add bonus points.`;
  $('#app').innerHTML = `
    <header class="brand"><span class="label">Veterinary nursing · student practice</span>
      <h1>Vet Terminology <span class="hy">Trainer</span></h1>
      <p>Prefixes, roots and suffixes with veterinary examples. Pick a game, a level and a topic, then answer with a tap or keys 1–4.</p></header>
    <section class="section"><span class="label">Game</span><div class="modes">${modeCards}</div></section>
    <section class="section"><span class="label">Level</span><div class="lvls">${levels}</div></section>
    <section class="section"><span class="label">Topic</span><div class="chips">${chips}</div>
      <p class="note">${count} ${what} in this selection. ${tip}</p></section>
    <button class="start" id="go">Start</button>
    <footer class="srcnote"><span>${LIST_KEYS.some(k => LIVE.live[k]) ? `Term list updated ${lastUpdated() || 'recently'}` : 'Built-in term list'} · ${P.length} word parts, ${T.length} terms, ${A.length} opposite pairs, ${X.length} abbreviations</span>
      ${LIVE.canEdit ? '<button class="ghost small" id="edit">Edit term list</button>' : ''}</footer>`;
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; render(); });
  document.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => { S.topic = b.dataset.topic; render(); });
  document.querySelectorAll('[data-level]').forEach(b => b.onclick = () => { S.level = b.dataset.level; render(); });
  $('#go').onclick = () => startRound();
  const ed = $('#edit'); if (ed) ed.onclick = () => { S.screen = 'edit'; E.status = ''; E.err = ''; render(); window.scrollTo(0,0); };
}
function renderPlay(){
  const q = S.q, done = q.picked!==null, ok = q.picked===q.answer;
  const blitz = S.mode==='blitz' && !S.practice;
  const total = blitz ? null : S.queue.length;
  const progress = blitz ? Math.max(0, (S.endAt-Date.now())/(BLITZ_SECS*1000))*100 : ((S.i + (done?1:0)) / total)*100;
  const opts = q.options.map((o,i) => {
    let cls = 'opt' + (q.partOpts ? ' part' : '');
    if (done){ if (i===q.answer) cls+=' right'; else if (i===q.picked) cls+=' wrong'; else cls+=' dim'; }
    return `<button class="${cls}" data-i="${i}" ${done?'disabled':''}><kbd>${i+1}</kbd><span>${esc(o)}</span></button>`;
  }).join('');
  const isLast = !blitz && S.i+1 >= total;
  $('#app').innerHTML = `
    <div class="hud">
      <div class="stat"><span class="label">Score</span><b id="score">${S.score.toLocaleString()}</b></div>
      <div class="stat"><span class="label">${blitz ? 'Time' : 'Question'}</span><b id="qn">${blitz ? Math.ceil(Math.max(0,S.endAt-Date.now())/1000)+'s' : `${S.i+1}/${total}`}</b></div>
      <div class="spacer"></div>${ecg()}
      <button class="ghost" id="quit">End</button>
    </div>
    <div class="bar ${blitz?'time':''}"><i id="prog" style="width:${progress}%"></i></div>
    <div class="card" id="qcard"><div class="askrow"><span class="ask">${esc(q.ask)}</span>${dots(String(q.src.l))}</div>
      <div class="big ${q.big.length>18?'long':''}">${esc(q.big)}</div></div>
    <div class="opts">${opts}</div>
    ${done ? `<div class="feedback ${ok?'ok':'no'}" role="status"><span class="verdict">${ok ? 'Correct' : 'Not quite. Answer: '+esc(q.correct)}</span>${q.explain}</div>
      ${blitz ? '' : `<div class="row"><button class="start" id="next">${isLast ? 'See results' : 'Next'}</button><span class="note">or press Enter</span></div>`}` : ''}`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.i));
  const n = $('#next'); if (n) n.onclick = () => nextQ();
  $('#quit').onclick = () => finish();
  if (blitz && !tick) tick = setInterval(() => {
    const left = S.endAt - Date.now();
    const t = $('#qn'), p = $('#prog');
    if (t) t.textContent = Math.ceil(Math.max(0,left)/1000)+'s';
    if (p) p.style.width = Math.max(0, left/(BLITZ_SECS*1000))*100 + '%';
    if (left <= 0 && S.screen==='play' && (!S.q || S.q.picked===null)) finish();
  }, 250);
}
function renderResults(){
  const acc = S.answered ? Math.round(100*S.right/S.answered) : 0;
  const best = store.get(`best:${S.mode}:${S.topic}:${S.level}`);
  const topicName = anyTopicName(S.topic);
  const missed = S.missed.length
    ? `<ul class="missed">${S.missed.map(m => `<li><div class="q">${esc(m.big)}</div><div class="a">${esc(m.correct)}</div></li>`).join('')}</ul>`
    : `<div class="clean">${S.answered ? 'Nothing missed. Clean round.' : 'No questions answered.'}</div>`;
  $('#app').innerHTML = `
    <header class="brand"><span class="label">${S.practice ? 'Practice round' : `${MODES[S.mode].name} · ${LEVELS.find(l=>l[0]===S.level)[1]} · ${topicName}`}</span>
      <h1>${S.answered && acc>=90 ? 'Excellent round' : acc>=70 ? 'Solid round' : 'Round complete'}</h1>
      ${S.lastBest ? '<span class="newbest">New personal best for this game and topic</span>' : best && !S.practice ? `<span class="note">Your best here: ${best.toLocaleString()}</span>` : ''}</header>
    <div class="score">
      <div><span class="label">Score</span><b>${S.score.toLocaleString()}</b></div>
      <div><span class="label">Correct</span><b>${S.right}/${S.answered}</b></div>
      <div><span class="label">Accuracy</span><b>${acc}%</b></div>
      <div><span class="label">Best streak</span><b>${S.bestStreak}</b></div></div>
    <section class="section"><span class="label">To revise (${S.missed.length})</span>${missed}</section>
    <div class="row">
      ${S.missed.length ? '<button class="start" id="redo">Practise these</button>' : ''}
      <button class="${S.missed.length ? 'ghost' : 'start'}" id="again">Play again</button>
      <button class="ghost" id="home">Change game</button></div>`;
  const r = $('#redo'); if (r) r.onclick = () => startRound(S.missed.map(m => ({kind:m.kind, item:m.item})));
  $('#again').onclick = () => startRound();
  $('#home').onclick = () => { S.screen='home'; render(); };
}
function render(){
  if (S.screen!=='play' && tick){ clearInterval(tick); tick=null; }
  ({home:renderHome, play:renderPlay, results:renderResults, edit:renderEdit})[S.screen]();
  store.set('prefs', {mode:S.mode, topic:S.topic, level:S.level});
}
document.addEventListener('keydown', e => {
  if (S.screen!=='play' || !S.q || e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.q.picked===null && /^[1-4]$/.test(e.key)){ e.preventDefault(); answer(+e.key-1); }
  else if (S.q.picked!==null && e.key==='Enter' && document.activeElement?.id!=='next'){ e.preventDefault(); if (!(S.mode==='blitz'&&!S.practice)) nextQ(); }
});

function start(saved){
  if (saved && saved.S && saved.S.screen){ S = Object.assign({level:'all'}, saved.S); }
  else { const p = store.get('prefs'); if (p && MODES[p.mode]) { S.mode = p.mode; S.topic = p.topic || 'all'; if (LEVELS.some(l=>l[0]===p.level)) S.level = p.level; } }
  if (S.screen==='edit') S.screen = 'home';
  render();
  connect();
}
window.claude?.hot?.snapshot?.(() => ({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
